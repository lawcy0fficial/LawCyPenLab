<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" id="aegis-map" role="img" aria-label="AEGIS Station schematic">
  <defs>
    <filter id="gm"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gm2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#232B3D"/>
    </marker>
  </defs>

  <!-- grid background -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30,0 L0,0 0,30" fill="none" stroke="#0f1520" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="540" fill="url(#grid)"/>

  <!-- connection tunnels -->
  <g stroke="#1a2235" stroke-width="18" stroke-linecap="round" fill="none">
    <line x1="450" y1="270" x2="200" y2="270"/>
    <line x1="450" y1="270" x2="700" y2="270"/>
    <line x1="450" y1="270" x2="450" y2="100"/>
    <line x1="450" y1="270" x2="450" y2="430"/>
    <line x1="200" y1="270" x2="80" y2="150"/>
    <line x1="200" y1="270" x2="80" y2="390"/>
    <line x1="700" y1="270" x2="820" y2="150"/>
    <line x1="700" y1="270" x2="820" y2="390"/>
  </g>
  <g stroke="#232B3D" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4 4">
    <line x1="450" y1="270" x2="200" y2="270"/>
    <line x1="450" y1="270" x2="700" y2="270"/>
    <line x1="450" y1="270" x2="450" y2="100"/>
    <line x1="450" y1="270" x2="450" y2="430"/>
    <line x1="200" y1="270" x2="80" y2="150"/>
    <line x1="200" y1="270" x2="80" y2="390"/>
    <line x1="700" y1="270" x2="820" y2="150"/>
    <line x1="700" y1="270" x2="820" y2="390"/>
  </g>

  <!-- CORE MODULE -->
  <g id="mod-core" class="map-module" data-label="CORE" data-status="nominal" style="cursor:pointer">
    <circle cx="450" cy="270" r="52" fill="#0d1520" stroke="#4FD8E0" stroke-width="2.5" filter="url(#gm)"/>
    <circle cx="450" cy="270" r="40" fill="#101929" stroke="#4FD8E0" stroke-width="1" opacity="0.6"/>
    <circle cx="450" cy="270" r="8" fill="#4FD8E0" opacity="0.8"/>
    <text x="450" y="306" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#4FD8E0" letter-spacing="2">CORE</text>
    <text x="450" y="317" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7" fill="#7C8699">NOMINAL</text>
  </g>

  <!-- REACTOR MODULE -->
  <g id="mod-reactor" class="map-module" data-label="REACTOR" data-status="warning" style="cursor:pointer">
    <rect x="356" y="54" width="88" height="70" rx="5" fill="#0d1520" stroke="#FF5C5C" stroke-width="2.5" filter="url(#gm)"/>
    <rect x="363" y="61" width="74" height="56" rx="3" fill="#101929" stroke="#FF5C5C" stroke-width="1" opacity="0.5"/>
    <circle cx="400" cy="83" r="10" fill="rgba(255,92,92,0.12)" stroke="#FF5C5C" stroke-width="1.5"/>
    <circle cx="400" cy="83" r="4" fill="#FF5C5C" opacity="0.9" filter="url(#gm)"/>
    <text x="400" y="105" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#FF5C5C" letter-spacing="1">REACTOR</text>
    <text x="400" y="115" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6.5" fill="#FF5C5C">⚠ HIGH TEMP</text>
  </g>

  <!-- LIFE SUPPORT -->
  <g id="mod-lifesupport" class="map-module" data-label="LIFE SUPPORT" data-status="nominal" style="cursor:pointer">
    <rect x="356" y="416" width="88" height="70" rx="5" fill="#0d1520" stroke="#4FD8E0" stroke-width="2.5"/>
    <rect x="363" y="423" width="74" height="56" rx="3" fill="#101929" stroke="#4FD8E0" stroke-width="1" opacity="0.5"/>
    <path d="M388 449 C388 436 412 436 412 449 C412 458 400 465 400 465 C400 465 388 458 388 449 Z" fill="rgba(79,216,224,0.1)" stroke="#4FD8E0" stroke-width="1.5"/>
    <text x="400" y="467" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#4FD8E0" letter-spacing="0">LIFE SUPP.</text>
    <text x="400" y="477" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6.5" fill="#7C8699">O2 98.4%</text>
  </g>

  <!-- CREW QUARTERS (left) -->
  <g id="mod-crew" class="map-module" data-label="CREW QUARTERS" data-status="nominal" style="cursor:pointer">
    <rect x="130" y="222" width="96" height="96" rx="48" fill="#0d1520" stroke="#4FD8E0" stroke-width="2.5"/>
    <rect x="148" y="240" width="60" height="60" rx="30" fill="#101929" stroke="#4FD8E0" stroke-width="1" opacity="0.5"/>
    <text x="178" y="277" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#4FD8E0">CREW</text>
    <text x="178" y="288" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#4FD8E0">QTR</text>
    <text x="178" y="302" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#7C8699">6 CREW</text>
  </g>

  <!-- COMMS HUB (right) -->
  <g id="mod-comms" class="map-module" data-label="COMMS HUB" data-status="nominal" style="cursor:pointer">
    <rect x="674" y="222" width="96" height="96" rx="48" fill="#0d1520" stroke="#4FD8E0" stroke-width="2.5"/>
    <rect x="692" y="240" width="60" height="60" rx="30" fill="#101929" stroke="#4FD8E0" stroke-width="1" opacity="0.5"/>
    <path d="M722 268 Q722 256 734 256 Q746 256 746 268" fill="none" stroke="#4FD8E0" stroke-width="1.5"/>
    <path d="M716 274 Q716 256 734 256 Q752 256 752 274" fill="none" stroke="#4FD8E0" stroke-width="1" opacity="0.5"/>
    <circle cx="734" cy="282" r="3" fill="#4FD8E0"/>
    <line x1="734" y1="282" x2="734" y2="295" stroke="#4FD8E0" stroke-width="2"/>
    <text x="722" y="310" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#4FD8E0">COMMS</text>
    <text x="722" y="320" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#7C8699">HUB</text>
  </g>

  <!-- CARGO BAY (upper-left) -->
  <g id="mod-cargo" class="map-module" data-label="CARGO BAY" data-status="nominal" style="cursor:pointer">
    <rect x="30" y="100" width="98" height="78" rx="5" fill="#0d1520" stroke="#F5A623" stroke-width="2.5"/>
    <rect x="38" y="108" width="82" height="62" rx="3" fill="#101929" stroke="#F5A623" stroke-width="1" opacity="0.5"/>
    <rect x="46" y="118" width="24" height="18" rx="2" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="1.2"/>
    <rect x="76" y="118" width="24" height="18" rx="2" fill="rgba(245,166,35,0.1)" stroke="#F5A623" stroke-width="1.2"/>
    <rect x="46" y="142" width="54" height="10" rx="2" fill="rgba(245,166,35,0.08)" stroke="#F5A623" stroke-width="1"/>
    <text x="79" y="158" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#F5A623">CARGO BAY</text>
    <text x="79" y="168" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#7C8699">24/40 SLOTS</text>
  </g>

  <!-- DOCKING RING (lower-left) -->
  <g id="mod-docking" class="map-module" data-label="DOCKING RING" data-status="nominal" style="cursor:pointer">
    <rect x="30" y="352" width="98" height="78" rx="5" fill="#0d1520" stroke="#4FD8E0" stroke-width="2.5"/>
    <rect x="38" y="360" width="82" height="62" rx="3" fill="#101929" stroke="#4FD8E0" stroke-width="1" opacity="0.5"/>
    <circle cx="79" cy="390" r="18" fill="none" stroke="#4FD8E0" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="79" cy="390" r="8" fill="rgba(79,216,224,0.08)" stroke="#4FD8E0" stroke-width="1.5"/>
    <text x="79" y="420" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#4FD8E0">DOCKING</text>
    <text x="79" y="430" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#7C8699">BAY-1 CLEAR</text>
  </g>

  <!-- SCIENCE LAB (upper-right) -->
  <g id="mod-science" class="map-module" data-label="SCIENCE LAB" data-status="warning" style="cursor:pointer">
    <rect x="772" y="100" width="98" height="78" rx="5" fill="#0d1520" stroke="#F5A623" stroke-width="2.5"/>
    <rect x="780" y="108" width="82" height="62" rx="3" fill="#101929" stroke="#F5A623" stroke-width="1" opacity="0.5"/>
    <circle cx="800" cy="135" r="8" fill="none" stroke="#F5A623" stroke-width="1.5"/>
    <circle cx="820" cy="135" r="8" fill="none" stroke="#F5A623" stroke-width="1.5"/>
    <line x1="800" y1="143" x2="800" y2="155" stroke="#F5A623" stroke-width="1.5"/>
    <line x1="820" y1="143" x2="820" y2="155" stroke="#F5A623" stroke-width="1.5"/>
    <line x1="800" y1="155" x2="820" y2="155" stroke="#F5A623" stroke-width="1.5"/>
    <circle cx="810" cy="128" r="4" fill="rgba(245,166,35,0.2)" stroke="#F5A623" stroke-width="1"/>
    <line x1="808" y1="135" x2="808" y2="155" stroke="#F5A623" stroke-width="1" opacity="0.4"/>
    <line x1="840" y1="120" x2="850" y2="118" stroke="#F5A623" stroke-width="1" opacity="0.5"/>
    <text x="821" y="168" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#F5A623">SCI-LAB</text>
    <text x="821" y="178" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#F5A623">⚠ QUARANTINE</text>
  </g>

  <!-- MEDICAL BAY (lower-right) -->
  <g id="mod-medical" class="map-module" data-label="MEDICAL BAY" data-status="nominal" style="cursor:pointer">
    <rect x="772" y="352" width="98" height="78" rx="5" fill="#0d1520" stroke="#4FD8E0" stroke-width="2.5"/>
    <rect x="780" y="360" width="82" height="62" rx="3" fill="#101929" stroke="#4FD8E0" stroke-width="1" opacity="0.5"/>
    <line x1="821" y1="375" x2="821" y2="405" stroke="#4FD8E0" stroke-width="3" stroke-linecap="round"/>
    <line x1="806" y1="390" x2="836" y2="390" stroke="#4FD8E0" stroke-width="3" stroke-linecap="round"/>
    <text x="821" y="420" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#4FD8E0">MED BAY</text>
    <text x="821" y="430" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#7C8699">DR. OSEI ON DUTY</text>
  </g>

  <!-- Solar panels left -->
  <g stroke="#F5A623" stroke-width="1" fill="rgba(245,166,35,0.06)">
    <rect x="28" y="245" width="100" height="12"/>
    <rect x="28" y="262" width="100" height="12"/>
    <line x1="28" y1="245" x2="28" y2="274"/><line x1="52" y1="245" x2="52" y2="274"/>
    <line x1="76" y1="245" x2="76" y2="274"/><line x1="100" y1="245" x2="100" y2="274"/>
    <line x1="124" y1="245" x2="124" y2="274"/>
  </g>
  <!-- Solar panels right -->
  <g stroke="#F5A623" stroke-width="1" fill="rgba(245,166,35,0.06)">
    <rect x="772" y="245" width="100" height="12"/>
    <rect x="772" y="262" width="100" height="12"/>
    <line x1="772" y1="245" x2="772" y2="274"/><line x1="796" y1="245" x2="796" y2="274"/>
    <line x1="820" y1="245" x2="820" y2="274"/><line x1="844" y1="245" x2="844" y2="274"/>
    <line x1="868" y1="245" x2="868" y2="274"/>
  </g>

  <!-- Module tooltip area -->
  <g id="map-tooltip" opacity="0" style="pointer-events:none">
    <rect id="tt-bg" x="370" y="350" width="160" height="48" rx="4" fill="#121826" stroke="#4FD8E0" stroke-width="1.5"/>
    <text id="tt-label" x="450" y="370" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#4FD8E0" font-weight="700"></text>
    <text id="tt-status" x="450" y="385" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="#7C8699"></text>
  </g>
</svg>
