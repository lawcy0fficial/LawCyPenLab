<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AEGIS station illustration">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(79,216,224,0.25)"/>
      <stop offset="100%" stop-color="rgba(79,216,224,0)"/>
    </radialGradient>
  </defs>
  <circle cx="320" cy="130" r="120" fill="url(#glow1)"/>
  <!-- distant planet -->
  <circle cx="70" cy="200" r="46" fill="#161D2C" stroke="#232B3D" stroke-width="1"/>
  <path d="M30 190 A46 46 0 0 0 108 205" fill="none" stroke="#F5A623" stroke-width="1" opacity="0.35"/>
  <!-- station core -->
  <g stroke="#4FD8E0" stroke-width="2" fill="none">
    <circle cx="320" cy="130" r="34"/>
    <circle cx="320" cy="130" r="8" fill="#4FD8E0" stroke="none"/>
    <ellipse cx="320" cy="130" rx="120" ry="34" />
    <ellipse cx="320" cy="130" rx="120" ry="34" transform="rotate(35 320 130)" opacity="0.5"/>
    <ellipse cx="320" cy="130" rx="120" ry="34" transform="rotate(-35 320 130)" opacity="0.5"/>
  </g>
  <!-- modules -->
  <g fill="#121826" stroke="#4FD8E0" stroke-width="1.5">
    <rect x="188" y="120" width="30" height="20" rx="3"/>
    <rect x="422" y="120" width="30" height="20" rx="3"/>
    <rect x="305" y="20" width="30" height="20" rx="3"/>
    <rect x="305" y="220" width="30" height="20" rx="3"/>
  </g>
  <!-- solar panels -->
  <g fill="rgba(245,166,35,0.12)" stroke="#F5A623" stroke-width="1.5">
    <rect x="80" y="118" width="70" height="24"/>
    <rect x="490" y="118" width="70" height="24"/>
  </g>
  <g stroke="#F5A623" stroke-width="0.75">
    <line x1="94" y1="118" x2="94" y2="142"/><line x1="108" y1="118" x2="108" y2="142"/>
    <line x1="122" y1="118" x2="122" y2="142"/><line x1="136" y1="118" x2="136" y2="142"/>
    <line x1="504" y1="118" x2="504" y2="142"/><line x1="518" y1="118" x2="518" y2="142"/>
    <line x1="532" y1="118" x2="532" y2="142"/><line x1="546" y1="118" x2="546" y2="142"/>
  </g>
  <!-- stars -->
  <g fill="#E4E9F2">
    <circle cx="40" cy="40" r="1"/><circle cx="120" cy="20" r="1.2"/><circle cx="200" cy="60" r="0.8"/>
    <circle cx="560" cy="40" r="1"/><circle cx="600" cy="80" r="1.3"/><circle cx="480" cy="30" r="0.9"/>
    <circle cx="20" cy="140" r="1"/><circle cx="610" cy="180" r="1"/><circle cx="350" cy="230" r="0.8"/>
  </g>
</svg>
