<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HTTP Request Smuggling">
  <!-- frontend pipe -->
  <rect x="2" y="10" width="20" height="10" rx="2" fill="rgba(79,216,224,0.08)" stroke="#4FD8E0" stroke-width="1.5"/>
  <text x="12" y="17.5" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="5" fill="#4FD8E0">FRONT</text>
  <!-- backend pipe -->
  <rect x="26" y="10" width="20" height="10" rx="2" fill="rgba(255,92,92,0.08)" stroke="#FF5C5C" stroke-width="1.5"/>
  <text x="36" y="17.5" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="5" fill="#FF5C5C">BACK</text>
  <!-- connectors -->
  <line x1="22" y1="15" x2="26" y2="15" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>
  <!-- CL arrow (clean) -->
  <rect x="2" y="26" width="13" height="7" rx="1" fill="rgba(79,216,224,0.06)" stroke="#4FD8E0" stroke-width="1"/>
  <text x="8.5" y="31" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="4.5" fill="#4FD8E0">CL:20</text>
  <!-- TE arrow (smuggled) -->
  <rect x="17" y="26" width="13" height="7" rx="1" fill="rgba(255,92,92,0.06)" stroke="#FF5C5C" stroke-width="1"/>
  <text x="23.5" y="31" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="4.5" fill="#FF5C5C">TE:chk</text>
  <!-- smuggled prefix -->
  <rect x="32" y="26" width="14" height="7" rx="1" fill="rgba(255,92,92,0.15)" stroke="#FF5C5C" stroke-width="1.5"/>
  <text x="39" y="31" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="4.5" fill="#FF5C5C">SMUG!</text>
  <!-- desync arrow -->
  <path d="M15,38 Q24,44 33,38" fill="none" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="24" y="46" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="4" fill="#F5A623">DESYNC</text>
</svg>
