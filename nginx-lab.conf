# LawCypenLab :: AEGIS STATION — Nginx reverse-proxy config
# FOR AUTHORIZED SECURITY TRAINING USE ONLY.
#
# 1. Copy to /etc/nginx/sites-available/lawcypenlab
# 2. ln -s /etc/nginx/sites-available/lawcypenlab /etc/nginx/sites-enabled/
# 3. certbot --nginx -d your-lab-host.example (or use self-signed below)
# 4. nginx -t && systemctl reload nginx
#
# Self-signed cert (students will get browser warning — that's fine for lab):
#   openssl req -x509 -newkey rsa:4096 -keyout /etc/ssl/aegis-lab.key \
#     -out /etc/ssl/aegis-lab.crt -days 365 -nodes \
#     -subj "/CN=aegis-lab/O=AEGIS Station/C=US"

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/aegis-lab.crt;
    ssl_certificate_key /etc/ssl/aegis-lab.key;

    # Intentionally weak TLS — matches the lab's teaching goals.
    # Do NOT use this config for anything real.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # Pass everything to Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Allow large uploads (file upload vulns need this)
        client_max_body_size 50M;
    }

    # WebSocket support for /ws routes
    location /ws {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
