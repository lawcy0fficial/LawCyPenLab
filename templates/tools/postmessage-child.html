<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<style>
  body{background:#010109;color:#8ab4d4;font-family:'JetBrains Mono',monospace;font-size:.78rem;padding:12px;margin:0;}
  h4{color:#00d4ff;margin-bottom:8px;font-size:.72rem;letter-spacing:.1em;}
  pre{background:#020218;border:1px solid #1a1a42;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}
  .tag{color:#ff3366;font-size:.65rem;}
</style></head>
<body>
<h4>CHILD IFRAME — VULNERABLE RECEIVER</h4>
<p class="tag">⚠ No origin check — accepts messages from any sender</p>
<pre id="log">Waiting for postMessage…</pre>
<script>
// VULN: no event.origin validation
window.addEventListener('message', function(e) {
  document.getElementById('log').textContent =
    'Received from: ' + (e.origin || '(unknown)') + '\n\n' +
    JSON.stringify(e.data, null, 2);
});
</script>
</body></html>
