{% extends 'base.html' %}
{% block title %}File Upload{% endblock %}
{% block content %}
<div class="pagehead"><h1>Document &amp; Avatar Upload</h1><p>Upload crew photos, manuals, or scanned forms.</p></div>
<div class="panel">
  <form method="POST" enctype="multipart/form-data">
    <label>Choose File</label>
    <input type="file" name="file" required>
    <button class="btn" type="submit">Upload</button>
  </form>
</div>
<div class="panel">
  <h2>Uploaded <span>Files</span></h2>
  <table class="data-table">
    <tr><th>Filename</th><th></th></tr>
    {% for f in files %}
    <tr><td>{{ f }}</td><td><a class="btn secondary small" href="{{ url_for('serve_upload', filename=f) }}" target="_blank">Open</a></td></tr>
    {% else %}
    <tr><td colspan="2" class="mono-dim">No files uploaded yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
